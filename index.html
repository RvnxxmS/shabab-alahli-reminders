<style>
:root{
  --red:#C8102E; --red-dark:#9E0C24; --green:#1E9E4A; --gold:#C9A94E;
  --bg:#f4f5f7; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --line:#e6e8ec; --shadow:0 4px 18px rgba(20,25,40,.08);
  --late:#e11d48; --soon:#f59e0b; --current:#2563eb; --done:#16a34a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'CairoEmbed','Segoe UI','Noto Kufi Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.6;
  padding-bottom:90px;
  -moz-font-feature-settings:"lnum";
  -webkit-font-feature-settings:"lnum";
  font-feature-settings:"lnum";
}
/* خطوط العناوين الرئيسية */
.appbar h1, .stat .n, .sheet-head h2, .item h3, .empty, .notif-inner h2,
#reportView h1, #reportView .rp-org .ar{
  font-family:'CairoEmbed','Segoe UI','Noto Kufi Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif;
  font-weight:800;
}
/* ضمان ظهور الأرقام بالإنجليزية في كامل الواجهة والتقارير */
input,select,textarea,.item,.meta,.stat,.badge,#reportView,#reportView *{font-variant-numeric:lining-nums;}
/* Header */
.appbar{
  background:linear-gradient(135deg,var(--red),var(--red-dark));
  color:#fff; padding:14px 16px calc(14px);
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:12px;
  box-shadow:0 3px 14px rgba(150,10,30,.35); position:sticky; top:0; z-index:50;
}
.appbar img{width:46px;height:46px;background:#fff;border-radius:12px;padding:3px;object-fit:contain}
.appbar .titles{flex:1;min-width:0}
.appbar h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px}
.appbar .sub{font-size:11.5px;opacity:.9;margin-top:1px}
.bell-btn{
  background:rgba(255,255,255,.16); border:0; color:#fff; width:44px;height:44px;
  border-radius:50%; font-size:20px; cursor:pointer; position:relative; display:grid;place-items:center;
}
.bell-btn:active{transform:scale(.94)}
.bell-badge{
  position:absolute; top:-2px; left:-2px; background:var(--gold); color:#3a2c00;
  min-width:19px;height:19px; border-radius:10px; font-size:11px; font-weight:800;
  display:grid;place-items:center; padding:0 4px; border:2px solid var(--red);
}
.sync-dot{position:absolute;top:0;left:0;width:11px;height:11px;border-radius:50%;background:#e0b0b6;border:2px solid var(--red)}
#syncBtn.on .sync-dot{background:#4ade80;box-shadow:0 0 7px #4ade80}
#syncBtn.pending .sync-dot{background:#f5c542;box-shadow:0 0 7px #f5c542}
.wrap{max-width:760px;margin:0 auto;padding:14px}

/* Stat cards */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{
  background:var(--card); border-radius:16px; padding:14px; box-shadow:var(--shadow);
  border:1px solid var(--line); cursor:pointer; transition:.15s; position:relative; overflow:hidden;
}
.stat:active{transform:scale(.97)}
.stat.active{outline:2.5px solid var(--red); outline-offset:-1px}
.stat .n{font-size:26px;font-weight:800;line-height:1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:4px;font-weight:600}
.stat .ic{position:absolute;left:12px;top:12px;font-size:20px;opacity:.85}
.stat.total .n{color:var(--ink)} .stat.late .n{color:var(--late)}
.stat.current .n{color:var(--current)} .stat.done .n{color:var(--done)}

/* Toolbar */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{
  border:0;border-radius:12px;padding:11px 14px;font-size:14px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.15s;font-family:inherit;
}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--red);color:#fff;box-shadow:0 3px 12px rgba(200,16,46,.3)}
.btn-green{background:var(--green);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn-gold{background:var(--gold);color:#3a2c00}
.btn-block{width:100%;justify-content:center;padding:14px}

/* Filters */
.filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{
  border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;
  padding:7px 14px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;flex-shrink:0;font-family:inherit;
}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}

/* Search */
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;margin-bottom:12px;font-family:inherit;background:#fff}
.search:focus{outline:2px solid var(--red);border-color:transparent}

/* Cards list */
.list{display:flex;flex-direction:column;gap:11px}
.item{
  background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);
  border:1px solid var(--line);border-right:5px solid var(--muted);position:relative;
}
.item.st-late{border-right-color:var(--late)}
.item.st-soon{border-right-color:var(--soon)}
.item.st-current{border-right-color:var(--current)}
.item.st-done{border-right-color:var(--done)}
.item h3{margin:0 0 4px;font-size:16px;font-weight:800}
.item .org{font-size:13px;color:var(--red);font-weight:700;margin-bottom:6px}
.item .desc{font-size:13px;color:var(--muted);margin-bottom:9px;white-space:pre-wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:10px}
.meta b{color:var(--ink);font-weight:700}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;margin-bottom:8px}
.badge.st-late{background:#fee2e2;color:var(--late)}
.badge.st-soon{background:#fef3c7;color:#b45309}
.badge.st-current{background:#dbeafe;color:var(--current)}
.badge.st-done{background:#dcfce7;color:var(--done)}
.item-actions{display:flex;gap:8px;flex-wrap:wrap}
.mini{border:0;border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.mini-done{background:#dcfce7;color:var(--done)}
.mini-undone{background:#f1f5f9;color:var(--muted)}
.mini-edit{background:#e0e7ff;color:#4338ca}
.mini-del{background:#fee2e2;color:var(--late)}
.mini-cal{background:#e0f2fe;color:#0369a1}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty .big{font-size:52px;margin-bottom:10px}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(15,20,35,.55);z-index:100;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px);
}
.overlay.show{display:flex}
.sheet{
  background:#fff;width:100%;max-width:600px;border-radius:22px 22px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{margin:0;font-size:19px;font-weight:800}
.x{background:#f1f5f9;border:0;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--muted)}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink)}
.field label .req{color:var(--red)}
.field input,.field textarea,.field select{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;font-size:14.5px;font-family:inherit;background:#fbfbfc;
}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid var(--red);border-color:transparent;background:#fff}
.field textarea{min-height:72px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save-row{display:flex;gap:10px;margin-top:8px}

/* Print/report area */
#reportView{display:none}
@media print{
  *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  body{padding:0;background:#fff}
  .appbar,.toolbar,.filters,.stats,.search,#mainView,.bell-btn,.fab,.overlay,.notif-panel,.toast{display:none !important}
  #reportView{display:block !important}
  #reportView img{display:inline-block !important}
  .wrap{max-width:100%;padding:0}
}
/* toast */
.toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;
  z-index:200;opacity:0;transition:.3s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.3);
}
.toast.show{opacity:1}
/* date range */
.range{display:none;gap:10px;margin-bottom:12px;background:#fff;padding:12px;border-radius:12px;border:1px solid var(--line)}
.range.show{display:grid;grid-template-columns:1fr 1fr}
.range label{font-size:12px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}
.range input{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-family:inherit}
/* notifications panel */
.notif-panel{position:fixed;inset:0;z-index:150;background:rgba(15,20,35,.5);display:none}
.notif-panel.show{display:block}
.notif-inner{position:absolute;top:0;left:0;right:0;background:#fff;max-height:80vh;overflow-y:auto;border-radius:0 0 20px 20px;padding:18px;padding-top:calc(18px + env(safe-area-inset-top))}
.notif-inner h2{margin:0 0 14px;font-size:18px}
.notif-item{padding:12px;border-radius:12px;background:#fef3c7;margin-bottom:9px;font-size:13.5px;border-right:4px solid var(--soon)}
.notif-item.urgent{background:#fee2e2;border-right-color:var(--late)}
.notif-item b{display:block;margin-bottom:2px}
</style>

<script>
/* ============ التخزين ============ */
const KEY = 'mawaeed_data_v1';
let items = [];
let currentFilter = 'all';
let deferredPrompt = null;

/* حالة الحفظ التلقائي في ملف (كمبيوتر) */
let fileHandle=null, autoSaveOn=false, autoSavePending=false, writing=false, writeQueued=false;
const FS_SUPPORTED = !!(window.showSaveFilePicker && window.showOpenFilePicker);

function loadData(){
  try{ items = JSON.parse(localStorage.getItem(KEY)) || []; }
  catch(e){ items = []; }
}
function persist(){
  localStorage.setItem(KEY, JSON.stringify(items));
  if(autoSaveOn) writeToFile();
}
function payloadNow(){
  return {app:'منبه المواعيد الذكي', version:1, exportedAt:new Date().toISOString(), count:items.length, items:items};
}

/* ---------- IndexedDB لحفظ مقبض الملف بين الجلسات ---------- */
function idb(mode,fn){return new Promise((res,rej)=>{const o=indexedDB.open('mawaeed_fs',1);o.onupgradeneeded=()=>{try{o.result.createObjectStore('h');}catch(e){}};o.onsuccess=()=>{const db=o.result;let out;try{const tx=db.transaction('h',mode);const st=tx.objectStore('h');out=fn(st);tx.oncomplete=()=>{db.close();res(out&&out.result!==undefined?out.result:out);};tx.onerror=()=>{db.close();rej(tx.error);};}catch(e){db.close();rej(e);}};o.onerror=()=>rej(o.error);});}
async function saveHandle(){try{await idb('readwrite',st=>st.put(fileHandle,'auto'));}catch(e){}}
async function loadHandle(){try{return await idb('readonly',st=>st.get('auto'));}catch(e){return null;}}
async function clearHandle(){try{await idb('readwrite',st=>st.delete('auto'));}catch(e){}}
async function verifyPerm(h,write){try{const opt={mode:write?'readwrite':'read'};if((await h.queryPermission(opt))==='granted')return true;if((await h.requestPermission(opt))==='granted')return true;}catch(e){}return false;}

async function writeToFile(){
  if(!fileHandle||!autoSaveOn)return false;
  if(writing){writeQueued=true;return false;}
  writing=true;
  try{
    const w=await fileHandle.createWritable();
    await w.write(JSON.stringify(payloadNow(),null,2));
    await w.close();
  }catch(e){ autoSaveOn=false; updateSyncUI(); toast('توقّف الحفظ التلقائي (تعذّرت الكتابة)'); }
  writing=false;
  if(writeQueued){writeQueued=false;return writeToFile();}
  return true;
}
function applyImported(arr){
  if(Array.isArray(arr)) items=arr;
  else if(arr && Array.isArray(arr.items)) items=arr.items;
}

/* ربط ملف جديد على القرص/Drive (كمبيوتر) */

async function resumeAutoSave(){
  if(!fileHandle){openSyncMenu();return;}
  let granted=false;
  try{granted=(await fileHandle.requestPermission({mode:'readwrite'}))==='granted';}catch(e){granted=false;}
  if(!granted){ toast('لم يُسمح بالوصول — أعد ربط الملف'); openSyncMenu(); return; }
  try{
    const text=await (await fileHandle.getFile()).text();
    try{ applyImported(JSON.parse(text)); }catch(err){}
    autoSaveOn=true;autoSavePending=false;render();updateSyncUI();closeSyncMenu();
    toast('تم استئناف الحفظ وتحميل أحدث البيانات ✅');
  }catch(e){ toast('تعذّرت قراءة الملف — أعد ربطه'); openSyncMenu(); }

async function disableAutoSave(){autoSaveOn=false;autoSavePending=false;fileHandle=null;await clearHandle();updateSyncUI();closeSyncMenu();toast('تم إيقاف الحفظ التلقائي');}

async function initAutoSave(){
  if(!FS_SUPPORTED)return;
  try{
    const h=await loadHandle();
    if(!h)return;
    fileHandle=h;
    let perm='prompt';
    try{perm=await h.queryPermission({mode:'readwrite'});}catch(e){}
    if(perm==='granted'){
      try{
        const text=await (await h.getFile()).text();
        applyImported(JSON.parse(text));
        autoSaveOn=true;autoSavePending=false;
      }catch(e){autoSavePending=true;}
    }else{autoSavePending=true;}
  }catch(e){}
  updateSyncUI();
}

/* ============ حساب الحالة ============ */
function statusOf(it){
  if(it.done) return 'done';
  if(!it.dueDate) return 'current';
  const now = new Date();
  const due = new Date(it.dueDate + 'T' + (it.dueTime || '23:59'));
  const diffMs = due - now;
  const diffDays = Math.ceil(diffMs / 86400000);
  if(diffMs < 0) return 'late';
  if(diffDays <= 3) return 'soon';
  return 'current';
}
const STATUS_AR = {late:'متأخر', soon:'قريب الاستحقاق', current:'جارٍ', done:'منجز'};

function daysLeft(it){
  if(!it.dueDate) return null;
  const now = new Date();
  const due = new Date(it.dueDate + 'T' + (it.dueTime||'23:59'));
  return Math.ceil((due - now)/86400000);
}

/* ============ الإحصائيات ============ */
function refreshStats(){
  let total=items.length, late=0, current=0, done=0;
  items.forEach(it=>{
    const s = statusOf(it);
    if(s==='done') done++;
    else if(s==='late') late++;
    else current++; // soon + current = "حالية" (غير منجزة وغير متأخرة)
  });
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stLate').textContent = late;
  document.getElementById('stCurrent').textContent = current;
  document.getElementById('stDone').textContent = done;
}

/* ============ الفلترة ============ */
function setFilter(f, el){
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.f===f));
  document.querySelectorAll('.stat').forEach(c=>c.classList.toggle('active', c.dataset.f===f));
  render();
}

function passFilter(it){
  const s = statusOf(it);
  // المواضيع المنجزة تختفي من كل الشاشات وتظهر فقط في فلتر «المنجزة»
  if(currentFilter==='done') return s==='done';
  if(it.done) return false;
  if(currentFilter==='all') return true;
  if(currentFilter==='late') return s==='late';
  if(currentFilter==='soon') return s==='soon';
  if(currentFilter==='current') return s!=='done' && s!=='late'; // حالية
  return true;
}

function passSearch(it){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  if(!q) return true;
  return (it.title+' '+it.org+' '+it.person+' '+it.desc).toLowerCase().includes(q);
}
function passRange(it){
  const from = document.getElementById('rangeFrom').value;
  const to = document.getElementById('rangeTo').value;
  if(!from && !to) return true;
  const d = it.dueDate || it.received;
  if(!d) return false;
  if(from && d < from) return false;
  if(to && d > to) return false;
  return true;
}

/* ============ العرض ============ */
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00');
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function render(){
  refreshStats();
  updateBell();
  const db = document.getElementById('doneBanner');
  if(db) db.style.display = (currentFilter==='done') ? 'flex' : 'none';
  const list = document.getElementById('list');
  let arr = items.filter(it=>passFilter(it)&&passSearch(it)&&passRange(it));
  // ترتيب: المتأخر أولاً ثم الأقرب موعداً
  arr.sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    const da=a.dueDate?new Date(a.dueDate+'T'+(a.dueTime||'23:59')):new Date(8640000000000000);
    const db=b.dueDate?new Date(b.dueDate+'T'+(b.dueTime||'23:59')):new Date(8640000000000000);
    return da-db;
  });
  if(arr.length===0){
    let msg = 'لا توجد مواضيع مطابقة';
    if(currentFilter==='done') msg = 'لا توجد مواضيع منجزة بعد';
    else if(currentFilter==='late') msg = 'لا توجد مواضيع متأخرة 👏';
    list.innerHTML = '<div class="empty"><div class="big">📭</div><div>'+msg+'</div></div>';
    return;
  }
  list.innerHTML = arr.map(it=>{
    const s = statusOf(it);
    const dl = daysLeft(it);
    let dueTxt = fmtDate(it.dueDate);
    if(it.dueTime) dueTxt += ' – '+it.dueTime;
    let leftTxt='';
    if(!it.done && dl!==null){
      if(dl<0) leftTxt = `متأخر ${Math.abs(dl)} يوم`;
      else if(dl===0) leftTxt = 'يستحق اليوم';
      else leftTxt = `متبقٍ ${dl} يوم`;
    }
    return `<div class="item st-${s}">
      <span class="badge st-${s}">${STATUS_AR[s]}${leftTxt?' • '+leftTxt:''}</span>
      <h3>${esc(it.title)}</h3>
      ${it.org?`<div class="org">🏛️ ${esc(it.org)}</div>`:''}
      ${it.desc?`<div class="desc">${esc(it.desc)}</div>`:''}
      <div class="meta">
        ${it.received?`<span>📥 الورود: <b>${fmtDate(it.received)}</b></span>`:''}
        ${it.dueDate?`<span>⏳ آخر موعد: <b>${dueTxt}</b></span>`:''}
        ${it.person?`<span>👤 المسؤول: <b>${esc(it.person)}</b></span>`:''}
      </div>
      <div class="item-actions">
        <button class="mini ${it.done?'mini-undone':'mini-done'}" onclick="toggleDone('${it.id}')">${it.done?'↩️ إعادة كجارٍ':'✅ إنجاز'}</button>
        ${it.dueDate?`<button class="mini mini-cal" onclick="addToCalendar('${it.id}')">📅 إضافة للتقويم</button>`:''}
        <button class="mini mini-edit" onclick="openForm('${it.id}')">✏️ تعديل</button>
        <button class="mini mini-del" onclick="delItem('${it.id}')">🗑️ حذف</button>
      </div>
    </div>`;
  }).join('');
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ============ النموذج ============ */
function openForm(id){
  const ov = document.getElementById('overlay');
  if(id){
    const it = items.find(x=>x.id===id);
    document.getElementById('formTitle').textContent = 'تعديل موضوع';
    document.getElementById('fId').value = it.id;
    document.getElementById('fTitle').value = it.title||'';
    document.getElementById('fOrg').value = it.org||'';
    document.getElementById('fDesc').value = it.desc||'';
    document.getElementById('fReceived').value = it.received||'';
    document.getElementById('fDueDate').value = it.dueDate||'';
    document.getElementById('fDueTime').value = it.dueTime||'';
    document.getElementById('fPerson').value = it.person||'';
    document.getElementById('delBtn').style.display='inline-flex';
  }else{

function closeForm(){ document.getElementById('overlay').classList.remove('show'); }

function saveItem(){
  const title = document.getElementById('fTitle').value.trim();
  if(!title){ toast('يرجى إدخال عنوان الموضوع'); return; }
  const id = document.getElementById('fId').value;
  const obj = {
    id: id || ('m'+Date.now()+Math.random().toString(36).slice(2,6)),
    title,
    org: document.getElementById('fOrg').value.trim(),
    desc: document.getElementById('fDesc').value.trim(),
    received: document.getElementById('fReceived').value,
    dueDate: document.getElementById('fDueDate').value,
    dueTime: document.getElementById('fDueTime').value,
    person: document.getElementById('fPerson').value.trim(),
    done: id ? items.find(x=>x.id===id).done : false,
    notified: id ? items.find(x=>x.id===id).notified||{} : {}
  };
  if(id){ items = items.map(x=>x.id===id?obj:x); }
  else { items.push(obj); }
  persist(); render(); closeForm();
  toast(id?'تم تعديل الموضوع':'تمت إضافة الموضوع');
}
function deleteFromForm(){
  const id = document.getElementById('fId').value;
  if(id) delItem(id, true);
  closeForm();
}
function delItem(id, silent){
  if(!silent && !confirm('هل تريد حذف هذا الموضوع؟')) return;
  items = items.filter(x=>x.id!==id);
  persist(); render();
  toast('تم الحذف');
}
function toggleDone(id){
  const it = items.find(x=>x.id===id);
  it.done = !it.done;
  persist(); render();
}

/* ============ إضافة للتقويم (ICS) ============ */
function pad2(n){return String(n).padStart(2,'0');}
function icsStamp(dt){ // صيغة UTC للطابع الزمني: YYYYMMDDTHHMMSSZ
  return dt.getUTCFullYear()+pad2(dt.getUTCMonth()+1)+pad2(dt.getUTCDate())+'T'+pad2(dt.getUTCHours())+pad2(dt.getUTCMinutes())+pad2(dt.getUTCSeconds())+'Z';
}
function icsLocal(dt){ // وقت محلي عائم (يظهر كما أُدخل بغض النظر عن المنطقة الزمنية)
  return dt.getFullYear()+pad2(dt.getMonth()+1)+pad2(dt.getDate())+'T'+pad2(dt.getHours())+pad2(dt.getMinutes())+pad2(dt.getSeconds());
}
function icsEscape(s){ return (s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n'); }

function addToCalendar(id){
  const it = items.find(x=>x.id===id);
  if(!it || !it.dueDate){ toast('لا يوجد موعد نهائي لهذا الموضوع'); return; }
  // وقت البداية = آخر موعد للرد (مع التوقيت إن وُجد، وإلا 09:00)
  const time = it.dueTime || '09:00';
  const start = new Date(it.dueDate+'T'+time);
  if(isNaN(start.getTime())){ toast('تعذّر قراءة التاريخ'); return; }
  const end = new Date(start.getTime()+30*60000); // 30 دقيقة

  const title = 'موعد نهائي: '+ (it.title||'موضوع');
  const descParts = [];
  if(it.org) descParts.push('الجهة: '+it.org);
  if(it.person) descParts.push('المسؤول: '+it.person);
  if(it.desc) descParts.push('التفاصيل: '+it.desc);
  descParts.push('— منبه المواعيد الذكي | السكرتارية التنفيذية');
  const description = descParts.join('\n');

  const uid = it.id+'@mawaeed-shababalahli';
  const now = new Date();

  // تذكيرات: قبل يوم، وقبل ساعة
  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Shabab Alahli//Mawaeed//AR',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:'+uid,
    'DTSTAMP:'+icsStamp(now),
    'DTSTART:'+icsLocal(start),
    'DTEND:'+icsLocal(end),
    'SUMMARY:'+icsEscape(title),
    'DESCRIPTION:'+icsEscape(description),
    it.org?('LOCATION:'+icsEscape(it.org)):'',
    'STATUS:CONFIRMED',
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:'+icsEscape('تذكير: '+title),
    'TRIGGER:-P1D',
    'END:VALARM',
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    'DESCRIPTION:'+icsEscape('تذكير: '+title),
    'TRIGGER:-PT1H',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR'
  ].filter(Boolean).join('\r\n');

  const blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const fname = 'موعد_'+(it.title||'موضوع').replace(/[\\/:*?"<>|]/g,'_').slice(0,40)+'.ics';
  const a = document.createElement('a');
  a.href = url; a.download = fname;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
  toast('تم إنشاء ملف الموعد 📅 — افتحه لإضافته للتقويم');
}

function toggleRange(){

/* ============ التنبيهات ============ */
function getAlerts(){
  const alerts=[];
  items.forEach(it=>{
    if(it.done) return;
    const dl = daysLeft(it);
    if(dl===null) return;
    if(dl<0) alerts.push({it,dl,type:'late'});
    else if(dl<=3) alerts.push({it,dl,type:'soon'});
  });
  alerts.sort((a,b)=>a.dl-b.dl);
  return alerts;
}
function updateBell(){
  const alerts = getAlerts();
  const badge = document.getElementById('bellBadge');
  if(alerts.length){ badge.style.display='grid'; badge.textContent=alerts.length; }
  else badge.style.display='none';
}
function openNotifs(){
  const alerts = getAlerts();
  const box = document.getElementById('notifList');
  if(alerts.length===0){
    box.innerHTML = '<div style="text-align:center;color:var(--muted);padding:30px">🎉 لا توجد مواعيد قريبة أو متأخرة</div>';
  }else{
    box.innerHTML = alerts.map(a=>{
      let msg;
      if(a.dl<0) msg = `⚠️ متأخر منذ ${Math.abs(a.dl)} يوم`;
      else if(a.dl===0) msg = '🔴 يستحق اليوم';
      else if(a.dl===1) msg = '🟠 يستحق غداً (متبقٍ يوم واحد)';
      else msg = `🟡 متبقٍ ${a.dl} يوم`;
      return `<div class="notif-item ${a.dl<=1?'urgent':''}" onclick="closeNotifs();openForm('${a.it.id}')">
        <b>${esc(a.it.title)}</b>
        ${a.it.org?esc(a.it.org)+' • ':''}${msg}
        ${a.it.dueTime?' • '+a.it.dueTime:''}
      </div>`;
    }).join('');
  }
  document.getElementById('notifPanel').classList.add('show');
}

function checkSystemNotifs(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const today = new Date().toISOString().slice(0,10);
  items.forEach(it=>{
    if(it.done) return;
    const dl = daysLeft(it);
    if(dl===null || dl>3 || dl<0) { 
      if(dl<0){ // متأخر
        it.notified = it.notified||{};
        if(it.notified['late']!==today){
          new Notification('⚠️ موضوع متأخر', {body:`${it.title} — تجاوز آخر موعد للرد`, icon:NOTIF_ICON});
          it.notified['late']=today; persist();
        }
      }
      return;
    }
    it.notified = it.notified||{};
    const key = 'd'+dl;
    if(it.notified[key]!==today){
      const txt = dl===0?'يستحق اليوم':dl===1?'متبقٍ يوم واحد':`متبقٍ ${dl} أيام`;
      new Notification('🔔 اقتراب موعد الرد', {body:`${it.title} — ${txt}`, icon:NOTIF_ICON});
      it.notified[key]=today; persist();
    }
  });
}
function requestNotifPerm(){
  if('Notification' in window && Notification.permission==='default'){
    Notification.requestPermission().then(()=>{ checkSystemNotifs(); updateNotifBtn(); });
  }
}
function enableNotifications(){
  if(!('Notification' in window)){ toast('هذا المتصفح لا يدعم الإشعارات'); return; }
  if(Notification.permission==='granted'){
    new Notification('🔔 منبه المواعيد الذكي', {body:'الإشعارات مُفعّلة بالفعل ✅', icon:NOTIF_ICON});
    checkSystemNotifs(); updateNotifBtn(); return;
  }
  if(Notification.permission==='denied'){
    toast('الإشعارات محظورة — فعّلها من إعدادات المتصفح لهذا الموقع');
    return;
  }
  Notification.requestPermission().then(p=>{
    updateNotifBtn();
    if(p==='granted'){ new Notification('🔔 تم تفعيل الإشعارات', {body:'ستصلك تنبيهات المواعيد قبل 3/2/1 يوم', icon:NOTIF_ICON}); checkSystemNotifs(); }
    else toast('لم يتم تفعيل الإشعارات');
  });
}
function updateNotifBtn(){
  const b=document.getElementById('notifEnableBtn');
  if(!b) return;
  if(!('Notification' in window)){ b.style.display='none'; return; }
  if(Notification.permission==='granted'){ b.style.display='none'; }
  else { b.style.display='flex'; }
}

function doPrint(){
  let arr = items.filter(it=>passFilter(it)&&passSearch(it)&&passRange(it));
  arr.sort((a,b)=>{
    const da=a.dueDate?new Date(a.dueDate+'T'+(a.dueTime||'23:59')):new Date(8640000000000000);
    const db=b.dueDate?new Date(b.dueDate+'T'+(b.dueTime||'23:59')):new Date(8640000000000000);
    return da-db;
  });
  const now = new Date().toLocaleString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
  const from = document.getElementById('rangeFrom').value;
  const to = document.getElementById('rangeTo').value;
  let rangeTxt = '';
  if(from||to) rangeTxt = ` | المدة: ${from?fmtDate(from):'—'} إلى ${to?fmtDate(to):'—'}`;
  const filterAr = {all:'الكل',late:'المتأخرة',soon:'قريبة الاستحقاق',current:'الحالية',done:'المنجزة'}[currentFilter];

  const rows = arr.map((it,i)=>{
    const s = statusOf(it);
    let dueTxt = fmtDate(it.dueDate); if(it.dueTime) dueTxt+=' '+it.dueTime;
    return `<tr>
      <td>${i+1}</td>
      <td><b>${esc(it.title)}</b>${it.desc?'<br><span style="color:#666;font-size:11px">'+esc(it.desc)+'</span>':''}</td>
      <td>${esc(it.org)||'—'}</td>
      <td>${fmtDate(it.received)}</td>
      <td>${it.dueDate?dueTxt:'—'}</td>
      <td>${esc(it.person)||'—'}</td>
      <td class="s-${s}">${STATUS_AR[s]}</td>

  document.getElementById('reportView').innerHTML = `
    <style>
      @media print{ @page{ margin:12mm; } }
      #reportView{font-family:'CairoEmbed','Segoe UI','Noto Kufi Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}

      #reportView .rp-head .rp-org{flex:1;text-align:center}

      #reportView .rp-head .rp-org .en{font-family:'CairoEmbed','Segoe UI','Noto Kufi Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif;color:#1E9E4A;font-size:12px;font-weight:700;letter-spacing:1px}
      #reportView .rp-head .rp-org .dept{font-family:'CairoEmbed','Segoe UI','Noto Kufi Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif;color:#555;font-size:11px;margin-top:3px}
      #reportView h1{font-family:'CairoEmbed','Segoe UI','Noto Kufi Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif;color:#C8102E;font-size:18px;text-align:center;margin:10px 0 4px;font-weight:800}
      #reportView .rp-info{text-align:center;font-size:11px;color:#666;margin-bottom:14px;background:#f7f7f7;padding:6px;border-radius:6px}
      #reportView table{width:100%;border-collapse:collapse;font-size:11.5px}
      #reportView th{font-family:'CairoEmbed','Segoe UI','Noto Kufi Arabic','Noto Sans Arabic',Tahoma,Arial,sans-serif;background:#C8102E !important;color:#fff !important;padding:7px 5px;border:1px solid #999;font-weight:700}

      #reportView .rp-sign{margin-top:26px;font-size:11px;color:#333;text-align:left;padding-left:20px}

      <thead><tr>
        <th>م</th><th>الموضوع</th><th>الجهة</th><th>الورود</th><th>آخر موعد للرد</th><th>المسؤول</th><th>الحالة</th>

}

/* ============ تصدير / استيراد ============ */
function exportJSON(){
  const data = JSON.stringify({app:'منبه المواعيد', version:1, exportedAt:new Date().toISOString(), items}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'مواعيد_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
  toast('تم تصدير الملف');
}
function importJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const imported = Array.isArray(parsed) ? parsed : parsed.items;
      if(!Array.isArray(imported)) throw new Error('صيغة غير صحيحة');
      if(confirm(`تم العثور على ${imported.length} موضوع.\nموافق = دمج مع الحالي\nإلغاء = استبدال الكل`)){
        const ids = new Set(items.map(x=>x.id));
        imported.forEach(x=>{ if(!ids.has(x.id)) items.push(x); });
      }else{
        items = imported;
      }
      persist(); render();
      toast('تم استيراد البيانات');
    }catch(err){ toast('تعذر قراءة الملف: '+err.message); }
    ev.target.value='';
  };
  reader.readAsText(file);
}
function saveAll(){ persist(); toast(autoSaveOn?'تم حفظ كل البيانات في الملف المربوط ✅':'تم الحفظ ✅'); }

/* ============ المزامنة (كمبيوتر + هاتف) ============ */
function updateSyncUI(){
  const b=document.getElementById('syncBtn');
  const dot=document.getElementById('syncDot');
  const lbl=document.getElementById('syncLabel');
  if(!b)return;
  b.classList.toggle('on',autoSaveOn);
  b.classList.toggle('pending',!autoSaveOn&&autoSavePending);
  if(lbl) lbl.textContent = autoSaveOn?'محفوظ تلقائياً':(autoSavePending?'استئناف الحفظ':'المزامنة');
}

/* هاتف: تحميل أحدث نسخة من ملف (مثلاً من Google Drive) */
function syncFromDevice(){ document.getElementById('syncFile').click(); }
function handleSyncFile(ev){
  const file = ev.target.files[0]; if(!file) return;
  // ملف فارغ أو غير محمّل من Drive
  if(typeof file.size==='number' && file.size===0){
    toast('الملف فارغ أو غير مُحمّل — حمّله في Drive ثم أعد المحاولة');
    ev.target.value=''; return;
  }
  const reader = new FileReader();
  reader.onerror = ()=>{ toast('تعذّرت قراءة الملف من هذا المصدر — انسخه إلى «التنزيلات» أولاً'); ev.target.value=''; };
  reader.onload = e=>{
    try{
      const raw = e.target.result;
      if(!raw || !raw.trim()){ toast('الملف فارغ — تأكد أنه مُحمّل في Drive'); ev.target.value=''; return; }
      const parsed = JSON.parse(raw);
      const imported = Array.isArray(parsed) ? parsed : parsed.items;
      if(!Array.isArray(imported)) throw new Error('صيغة غير صحيحة');
      items = imported;
      persist(); render(); closeSyncMenu();
      toast('تمت المزامنة — حُمّلت '+imported.length+' موضوع ✅');
    }catch(err){ toast('صيغة الملف غير صحيحة — تأكد أنه ملف بيانات النظام (.json)'); }
    ev.target.value='';
  };
  try{ reader.readAsText(file); }
  catch(e){ toast('تعذّر فتح الملف — انسخه إلى «التنزيلات» ثم أعد المحاولة'); ev.target.value=''; }
}
/* هاتف: حفظ نسخة محدّثة لرفعها على Drive (بنفس الاسم الثابت) */
function saveToDevice(){
  const data = JSON.stringify(payloadNow(), null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'مواعيد_شباب_الأهلي.json';
  a.click(); URL.revokeObjectURL(url);
  closeSyncMenu();
  toast('تم حفظ نسخة — ارفعها على Drive فوق الملف القديم');
}

/* قائمة المزامنة */
function openSyncMenu(){
  const isDesktop = FS_SUPPORTED;
  let html = '<div class="sheet-head"><h2>🔄 المزامنة والحفظ</h2><button class="x" onclick="closeSyncMenu()">✕</button></div>';
  if(isDesktop){
    const status = autoSaveOn
      ? '<span style="color:#0f6a3f;font-weight:800">مُفعّل ✓ — كل تعديل يُحفظ في الملف تلقائياً</span>'
      : (autoSavePending?'<span style="color:#b45309;font-weight:800">ملف مربوط سابقاً — بحاجة لاستئناف</span>':'<span style="color:var(--muted)">غير مُفعّل</span>');
    html += '<p style="font-size:13.5px;color:var(--muted);line-height:1.9;margin-bottom:6px">اربط النظام بملف على جهازك (يمكن وضعه داخل مجلد <b>Google Drive</b>) ليُحفظ فيه كل تعديل تلقائياً. الحالة الآن: '+status+'</p>';
    html += '<div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">';
    if(autoSavePending) html += '<button class="btn btn-primary btn-block" onclick="resumeAutoSave()">▶️ استئناف الحفظ في الملف المربوط</button>';
    html += '<button class="btn btn-gold btn-block" onclick="linkExistingFile()">🔗 ربط ملف موجود (يحوي بياناتي) والاستمرار عليه</button>';
    html += '<button class="btn btn-ghost btn-block" onclick="linkNewFile()">🆕 إنشاء ملف حفظ جديد</button>';
    if(autoSaveOn) html += '<button class="btn btn-block" style="background:#fee2e2;color:var(--late)" onclick="disableAutoSave()">⏹️ إيقاف الحفظ التلقائي</button>';
    html += '</div>';
    html += '<div style="border-top:1px dashed var(--line);margin:16px 0 10px"></div>';
  }
  // قسم الهاتف (يظهر دائماً — مفيد على الجوال)
  html += '<p style="font-size:13.5px;color:var(--muted);line-height:1.9;margin-bottom:6px"><b>على الهاتف:</b> بعد وضع ملف بياناتك في Google Drive، استخدم الزرّين التاليين للمزامنة بضغطة واحدة.</p>';
  html += '<div style="display:flex;flex-direction:column;gap:10px">';
  html += '<button class="btn btn-primary btn-block" onclick="syncFromDevice()">⬇️ مزامنة (تحميل أحدث نسخة من Drive)</button>';
  html += '<button class="btn btn-green btn-block" onclick="saveToDevice()">⬆️ حفظ إلى Drive (تنزيل نسخة محدّثة للرفع)</button>';
  html += '</div>';
  html += '<div style="background:#f7f8fa;border-radius:10px;padding:11px;margin-top:14px;font-size:12px;color:var(--muted);line-height:1.9">💡 <b>طريقة العمل على الهاتف:</b><br>١) افتح Drive واحفظ ملف البيانات فيه.<br>٢) عند فتح التطبيق اضغط «مزامنة» واختر الملف لتحميل أحدث بياناتك.<br>٣) بعد إضافة/تعديل مواضيع اضغط «حفظ إلى Drive»، ثم ارفع النسخة على Drive فوق الملف القديم (استبدال).</div>';

  document.getElementById('syncSheet').innerHTML = html;
  document.getElementById('syncOverlay').classList.add('show');
}
function closeSyncMenu(){ document.getElementById('syncOverlay').classList.remove('show'); }

/* ============ التثبيت PWA ============ */
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt = e;
  const b = document.getElementById('installBtn');
  b.style.display='flex';
  b.textContent = '📲 تثبيت التطبيق الآن على الهاتف';
});

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}

function installApp(){
  if(deferredPrompt){
    // التثبيت المباشر بنقرة واحدة (متاح عند فتح الملف عبر رابط/خادم)
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(res=>{
      deferredPrompt=null;
      if(res.outcome==='accepted'){ document.getElementById('installBtn').style.display='none'; }
    });
  }else{
    // إرشادات يدوية لأندرويد (تظهر عند فتح الملف محلياً حيث لا يتوفر التثبيت التلقائي)
    const hint = document.getElementById('installHint');
    hint.style.display='block';
    hint.innerHTML =
      '<b>📲 طريقة التثبيت على أندرويد:</b><br>'+
      '1) افتح هذا الملف داخل متصفح <b>Google Chrome</b>.<br>'+
      '2) اضغط على زر القائمة <b>(⋮)</b> أعلى يمين المتصفح.<br>'+
      '3) اختر <b>«تثبيت التطبيق»</b> أو <b>«إضافة إلى الشاشة الرئيسية»</b>.<br>'+
      '4) اضغط <b>«تثبيت / إضافة»</b> — ستظهر أيقونة التطبيق بشعار النادي على شاشة الهاتف.<br><br>'+
      '<span style="color:#b45309">ملاحظة: زر التثبيت التلقائي بنقرة واحدة يظهر فقط عند فتح التطبيق عبر رابط (خادم/استضافة)، أما عند فتح الملف مباشرةً من الجهاز فاستخدم الخطوات أعلاه.</span>';
  }
}

window.addEventListener('appinstalled', ()=>{
  toast('تم تثبيت التطبيق بنجاح 🎉');
  document.getElementById('installBtn').style.display='none';
  document.getElementById('installHint').style.display='none';
});

// إخفاء زر التثبيت إذا كان التطبيق مثبتاً ويعمل كتطبيق مستقل
if(isStandalone()){
  const b = document.getElementById('installBtn');
  if(b) b.style.display='none';
}

/* ============ Toast ============ */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2400);
}

/* ============ التشغيل ============ */
async function boot(){
  loadData();
  render();
  requestNotifPerm();
  checkSystemNotifs();
  updateNotifBtn();
  await initAutoSave();      // استعادة ربط الملف على الكمبيوتر إن وُجد
  render(); updateSyncUI();
  // نافذة استئناف الحفظ عند الفتح (كمبيوتر) إن كان هناك ملف مربوط يحتاج إذناً
  if(FS_SUPPORTED && !autoSaveOn && autoSavePending && fileHandle){
    setTimeout(openSyncMenu, 600);
  }
}
boot();
setInterval(()=>{ render(); checkSystemNotifs(); }, 60000); // تحديث كل دقيقة

<script>
function registerPWA(){
  // ---- Manifest inline (blob) ----
  const manifest = {
    id: "/",
    name: "منبه المواعيد الذكي - شباب الأهلي",
    short_name: "منبه المواعيد",
    description: "منبه ومتابع المواعيد الرسمية",
    start_url: "https://rvnxxms.github.io/shabab-alahli-reminders/",
    scope: "https://rvnxxms.github.io/shabab-alahli-reminders/",
    display: "standalone",
    orientation: "portrait",
    background_color: "#ffffff",
    theme_color: "#C8102E",
    dir: "rtl",
    lang: "ar",
    icons: [
      {src:"https://rvnxxms.github.io/shabab-alahli-reminders/icon-192x192-any.png", sizes:"192x192", type:"image/png", purpose:"any"},
      {src:"https://rvnxxms.github.io/shabab-alahli-reminders/icon-512x512-any.png", sizes:"512x512", type:"image/png", purpose:"any"},
      {src:"https://rvnxxms.github.io/shabab-alahli-reminders/icon-192x192-maskable.png", sizes:"192x192", type:"image/png", purpose:"maskable"},
      {src:"https://rvnxxms.github.io/shabab-alahli-reminders/icon-512x512-maskable.png", sizes:"512x512", type:"image/png", purpose:"maskable"}
    ]
  };
  // A static manifest.json is now linked directly in <head>, so we no longer
  // override it with a blob: URL here (blob URLs can't be fetched by
  // external tools like PWABuilder / Android's TWA packager).
  void manifest; // kept for reference / potential future dynamic use

  // ---- Service Worker inline (blob) ----
  if('serviceWorker' in navigator){
    const swCode = `
      const CACHE='mawaeed-v1';
      self.addEventListener('install', e=>{ self.skipWaiting(); });
      self.addEventListener('activate', e=>{ e.waitUntil(clients.claim()); });
      self.addEventListener('fetch', e=>{
        e.respondWith(
          caches.match(e.request).then(r=> r || fetch(e.request).then(resp=>{
            return caches.open(CACHE).then(c=>{ try{c.put(e.request, resp.clone())}catch(_){} return resp; });
          }).catch(()=>caches.match('/')))
        );
      });
    `;
    const swBlob = new Blob([swCode], {type:'text/javascript'});
    const swURL = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swURL).catch(err=>console.log('SW:',err));
  }
}
